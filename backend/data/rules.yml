version: "3.1"

rules:
  # 在问候、能力说明、兜底等规则前执行 action_deactivate_loop，避免与未结束的表单追问叠成两条 bot 消息。
  - rule: 问候
    steps:
      - intent: greet
      - action: action_deactivate_loop
      - action: utter_greet

  - rule: 告别
    steps:
      - intent: goodbye
      - action: action_deactivate_loop
      - action: utter_goodbye

  - rule: 能做什么
    steps:
      - intent: ask_capabilities
      - action: action_deactivate_loop
      - action: utter_capabilities

  # 多条选索书号后用户输入常为 nlu_fallback；与 stories 一致须走提交（Action 内已校验索书号，空槽会重回表单）。
  - rule: 借书多条索书号 nlu_fallback 后提交
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: multi_pick
    steps:
      - intent: nlu_fallback
      - action: action_borrow_call_form_submit

  - rule: 还书多条索书号 nlu_fallback 后提交
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: multi_pick
    steps:
      - intent: nlu_fallback
      - action: action_return_call_form_submit

  # 书名/索书号短句常被标成 nlu_fallback；借书刚查完「无在架」时 borrow_phase 为 empty，不应再走「兜底」打断会话。
  - rule: 借书无在架后同句 nlu_fallback 提示
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: empty
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: utter_borrow_query_done_hint

  - rule: 还书无待还后同句 nlu_fallback 提示
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: empty
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: utter_return_query_done_hint

  # 有活跃表单时勿抢答：否则用户填槽短句易被标成 nlu_fallback，整句走兜底并 deactivate_loop，预约流中断。
  # defer_nlu_fallback 为 true 时禁止本兜底；仅在借/还流程均处于 idle 时走默认兜底（避免与 empty 路径冲突）。
  - rule: NLU 置信度不足时兜底（无表单）
    condition:
      - active_loop: null
      - slot_was_set:
          - defer_nlu_fallback: false
      - slot_was_set:
          - borrow_phase: idle
      - slot_was_set:
          - return_phase: idle
    steps:
      - intent: nlu_fallback
      - action: action_deactivate_loop
      - action: utter_default

  - rule: FAQ
    steps:
      - intent: faq
      - action: action_deactivate_loop
      - action: utter_faq

  - rule: 借阅指引
    steps:
      - intent: borrow_guide
      - action: action_deactivate_loop
      - action: utter_borrow_guide

  - rule: 数据类咨询说明
    condition:
      - active_loop: null
    steps:
      - intent: data_inquiry
      - action: action_deactivate_loop
      - action: utter_data_inquiry

  - rule: 推荐阅读
    condition:
      - active_loop: null
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - action: action_reading_recommend

  - rule: 书籍总览
    steps:
      - intent: book_overview
      - action: action_deactivate_loop
      - action: action_book_overview

  # 表单激活不加 action_deactivate_loop，否则与 stories.yml 中带 Memoization 的多轮路径冲突（InvalidRule）。
  # 仅无活跃表单时才根据意图激活新表单，避免填书名时整句被标成 borrow_book 导致重复激活、与表单填槽打架。
  - rule: 激活借书表单
    condition:
      - active_loop: null
    steps:
      - intent: borrow_book
      - action: borrow_book_form
      - active_loop: borrow_book_form

  - rule: 激活还书表单
    condition:
      - active_loop: null
    steps:
      - intent: return_book
      - action: return_book_form
      - active_loop: return_book_form

  - rule: 激活空间预约表单
    condition:
      - active_loop: null
    steps:
      - intent: space_booking
      - action: space_booking_form
      - active_loop: space_booking_form
