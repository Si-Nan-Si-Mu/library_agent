version: "3.1"

rules:
  # 在问候、能力说明、兜底等规则前执行 action_deactivate_loop，避免与未结束的表单追问叠成两条 bot 消息。
  - rule: 问候
    condition:
      - active_loop: null
    steps:
      - intent: greet
      - action: action_deactivate_loop
      - action: utter_greet

  - rule: 告别
    condition:
      - active_loop: null
    steps:
      - intent: goodbye
      - action: action_deactivate_loop
      - action: utter_goodbye

  - rule: 能做什么
    condition:
      - active_loop: null
    steps:
      - intent: ask_capabilities
      - action: action_deactivate_loop
      - action: utter_capabilities

  # 多条选索书号后用户输入常为 nlu_fallback；与 stories 一致须走提交（Action 内已校验索书号，空槽会重回表单）。
  - rule: 借书多条索书号 nlu_fallback 后提交
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: multi_pick
    steps:
      - intent: nlu_fallback
      - action: action_borrow_call_form_submit

  - rule: 还书多条索书号 nlu_fallback 后提交
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: multi_pick
    steps:
      - intent: nlu_fallback
      - action: action_return_call_form_submit

  # 书名/索书号短句常被标成 nlu_fallback；借书刚查完「无在架」时 borrow_phase 为 empty，不应再走「兜底」打断会话。
  - rule: 借书无在架后同句 nlu_fallback 提示
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: empty
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: utter_borrow_query_done_hint

  - rule: 还书无待还后同句 nlu_fallback 提示
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: empty
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: utter_return_query_done_hint

  # 表单追问槽位时，短句书名常被识别为 nlu_fallback：必须继续表单，不能掉到全局 utter_default。
  - rule: 借书表单内 nlu_fallback 继续追问
    condition:
      - active_loop: borrow_book_form
    steps:
      - intent: nlu_fallback
      - action: borrow_book_form
      - active_loop: borrow_book_form

  - rule: 还书表单内 nlu_fallback 继续追问
    condition:
      - active_loop: return_book_form
    steps:
      - intent: nlu_fallback
      - action: return_book_form
      - active_loop: return_book_form

  # 书名短句常被标成 book_introduce：若不拦截会中断表单并命中「单书介绍」规则，批量还书时 return_profile 无法被提交。
  - rule: 借书表单内 book_introduce 继续追问
    condition:
      - active_loop: borrow_book_form
    steps:
      - intent: book_introduce
      - action: borrow_book_form
      - active_loop: borrow_book_form

  - rule: 还书表单内 book_introduce 继续追问
    condition:
      - active_loop: return_book_form
    steps:
      - intent: book_introduce
      - action: return_book_form
      - active_loop: return_book_form

  - rule: 借书择号表单内 book_introduce 继续追问
    condition:
      - active_loop: borrow_call_form
    steps:
      - intent: book_introduce
      - action: borrow_call_form
      - active_loop: borrow_call_form

  - rule: 还书择号表单内 book_introduce 继续追问
    condition:
      - active_loop: return_call_form
    steps:
      - intent: book_introduce
      - action: return_call_form
      - active_loop: return_call_form

  # 用户按 utter_default 提示说「推荐阅读」等时，若仍在借/还书填表流程，原「推荐阅读」规则因 active_loop 非 null 不命中；先退出表单再进入推荐。
  - rule: 借书表单中推荐阅读
    condition:
      - active_loop: borrow_book_form
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_reading_recommend

  - rule: 还书表单中推荐阅读
    condition:
      - active_loop: return_book_form
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_reading_recommend

  - rule: 借书择号表单中推荐阅读
    condition:
      - active_loop: borrow_call_form
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_reading_recommend

  - rule: 还书择号表单中推荐阅读
    condition:
      - active_loop: return_call_form
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_reading_recommend

  # 借/还确认阶段短句「否」易被标成 nlu_fallback；用规则绑定 deny，避免只剩 Memoization 时漏匹配。
  - rule: 借书单条确认后否定
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: single_confirm
    steps:
      - intent: deny
      - action: action_borrow_confirm_cancel

  - rule: 借书单条确认后 nlu_fallback 放弃
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: single_confirm
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: action_borrow_confirm_cancel

  - rule: 借书多本择号确认后否定
    condition:
      - active_loop: null
      - slot_was_set:
          - borrow_phase: multi_pick
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: deny
      - action: action_borrow_confirm_cancel

  - rule: 还书单条确认后否定
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: single_confirm
    steps:
      - intent: deny
      - action: action_return_confirm_cancel

  - rule: 还书单条确认后 nlu_fallback 放弃
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: single_confirm
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: action_return_confirm_cancel

  - rule: 还书多本择号确认后否定
    condition:
      - active_loop: null
      - slot_was_set:
          - return_phase: multi_pick
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: deny
      - action: action_return_confirm_cancel

  # 有活跃表单时勿抢答：否则用户填槽短句易被标成 nlu_fallback，整句走兜底并 deactivate_loop，预约流中断。
  # defer_nlu_fallback 为 true 时禁止本兜底；仅在借/还流程均处于 idle 时走默认兜底（避免与 empty 路径冲突）。
  - rule: NLU 置信度不足时兜底（无表单）
    condition:
      - active_loop: null
      - slot_was_set:
          - defer_nlu_fallback: false
    steps:
      - intent: nlu_fallback
      - action: action_deactivate_loop
      - action: action_nlu_fallback_router

  - rule: 单书介绍（DeepSeek + 馆藏事实）
    condition:
      - active_loop: null
    steps:
      - intent: book_introduce
      - action: action_deactivate_loop
      - action: action_book_introduce

  - rule: FAQ
    condition:
      - active_loop: null
    steps:
      - intent: faq
      - action: action_deactivate_loop
      - action: utter_faq

  - rule: 借阅指引
    condition:
      - active_loop: null
    steps:
      - intent: borrow_guide
      - action: action_deactivate_loop
      - action: utter_borrow_guide

  - rule: 数据类咨询说明
    condition:
      - active_loop: null
    steps:
      - intent: data_inquiry
      - action: action_deactivate_loop
      - action: action_data_inquiry

  - rule: 借阅记录查询
    condition:
      - active_loop: null
    steps:
      - intent: borrow_record_query
      - action: action_deactivate_loop
      - action: action_borrow_record_query

  - rule: 推荐阅读
    condition:
      - active_loop: null
    steps:
      - intent: reading_recommend
      - action: action_deactivate_loop
      - action: action_reading_recommend

  - rule: 书籍总览
    condition:
      - active_loop: null
    steps:
      - intent: book_overview
      - action: action_deactivate_loop
      - action: action_book_overview

  - rule: 书籍总览翻页（前端内嵌表触发；口令仅用于 NLU）
    condition:
      - active_loop: null
    steps:
      - intent: book_overview_pager
      - action: action_deactivate_loop
      - action: action_book_overview

  # 表单激活不加 action_deactivate_loop，否则与 stories.yml 中带 Memoization 的多轮路径冲突（InvalidRule）。
  # 仅无活跃表单时才根据意图激活新表单，避免填书名时整句被标成 borrow_book 导致重复激活、与表单填槽打架。
  - rule: 激活借书表单
    condition:
      - active_loop: null
    steps:
      - intent: borrow_book
      - action: borrow_book_form
      - active_loop: borrow_book_form

  - rule: 激活还书表单
    condition:
      - active_loop: null
    steps:
      - intent: return_book
      - action: return_book_form
      - active_loop: return_book_form

  - rule: 激活空间预约表单
    condition:
      - active_loop: null
    steps:
      - intent: space_booking
      - action: space_booking_form
      - active_loop: space_booking_form

  - rule: 借书索书号表单中重开借书
    condition:
      - active_loop: borrow_call_form
    steps:
      - intent: borrow_book
      - action: action_deactivate_loop
      - active_loop: null
      - action: borrow_book_form
      - active_loop: borrow_book_form

  - rule: 还书索书号表单中重开还书
    condition:
      - active_loop: return_call_form
    steps:
      - intent: return_book
      - action: action_deactivate_loop
      - active_loop: null
      - action: return_book_form
      - active_loop: return_book_form

  # 表单正常填完后，显式提交，避免策略未命中时掉到 action_default_fallback。
  - rule: 提交借书表单
    condition:
      - active_loop: borrow_book_form
    steps:
      - action: borrow_book_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_borrow_book_form_submit
    wait_for_user_input: false

  - rule: 提交还书表单
    condition:
      - active_loop: return_book_form
    steps:
      - action: return_book_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_return_book_form_submit
    wait_for_user_input: false

  - rule: 提交借书索书号表单
    condition:
      - active_loop: borrow_call_form
    steps:
      - action: borrow_call_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_borrow_call_form_submit
    wait_for_user_input: false

  - rule: 提交还书索书号表单
    condition:
      - active_loop: return_call_form
    steps:
      - action: return_call_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_return_call_form_submit
    wait_for_user_input: false
