version: "3.1"

intents:
  - greet
  - goodbye
  - ask_capabilities
  - nlu_fallback
  - faq:
      is_retrieval_intent: true
  - affirm
  - deny
  - borrow_book:
      use_entities: []
  - return_book:
      use_entities: []
  - borrow_guide
  - space_booking:
      use_entities: []
  - reading_recommend:
      use_entities: []
  - data_inquiry
  - book_overview
  - borrow_record_query

entities:
  - book_title
  - call_number
  - room_type
  - time_slot
  - topic
  - floor_zone

slots:
  api_borrow_succeed:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  api_return_succeed:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  api_space_book_succeed:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  last_borrow_detail:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_return_detail:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  borrow_phase:
    type: categorical
    influence_conversation: true
    values:
      - idle
      - single_confirm
      - multi_pick
      - empty
    initial_value: idle
    mappings:
      - type: custom

  return_phase:
    type: categorical
    influence_conversation: true
    values:
      - idle
      - single_confirm
      - multi_pick
      - empty
    initial_value: idle
    mappings:
      - type: custom

  defer_nlu_fallback:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  book_title:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: book_title
      # 填表时整句作书名（避免纯文字书名被标成 nlu_fallback 后无法入槽）
      - type: from_text
        conditions:
          - active_loop: borrow_book_form
            requested_slot: book_title
      - type: from_text
        conditions:
          - active_loop: return_book_form
            requested_slot: book_title

  call_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: call_number
      # 索书号常为数字/字母组合，NLU 易判为 nlu_fallback；用整句填槽
      - type: from_text
        conditions:
          - active_loop: borrow_call_form
            requested_slot: call_number
      - type: from_text
        conditions:
          - active_loop: return_call_form
            requested_slot: call_number

  room_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: room_type

  time_slot:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: time_slot

  topic:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: topic

  last_recommended_title:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_recommended_call_number:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_recommended_candidates:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:
  # 用户在同一会话中切换问候/能力说明/其它业务时，应退出当前表单，避免与规则回复叠成两条 bot 消息。
  borrow_book_form:
    required_slots:
      - book_title
    ignored_intents:
      - greet
      - goodbye
      - ask_capabilities
      - borrow_guide
      - reading_recommend
      - space_booking
      - return_book
      - faq

  borrow_call_form:
    required_slots:
      - call_number
    ignored_intents:
      - greet
      - goodbye
      - ask_capabilities
      - borrow_guide
      - data_inquiry
      - reading_recommend
      - space_booking
      - return_book
      - faq

  return_book_form:
    required_slots:
      - book_title
    ignored_intents:
      - greet
      - goodbye
      - ask_capabilities
      - borrow_guide
      - reading_recommend
      - space_booking
      - borrow_book
      - faq

  return_call_form:
    required_slots:
      - call_number
    ignored_intents:
      - greet
      - goodbye
      - ask_capabilities
      - borrow_guide
      - data_inquiry
      - reading_recommend
      - space_booking
      - borrow_book
      - faq

  space_booking_form:
    required_slots:
      - room_type
      - time_slot
    ignored_intents:
      - greet
      - goodbye
      - ask_capabilities
      - borrow_guide
      - data_inquiry
      - reading_recommend
      - borrow_book
      - return_book
      - faq

responses:
  utter_default:
    - text: "我不太明白您的意思。您可以说：借书、还书、借阅规则、研讨间预约、推荐阅读，或「开馆时间」等常见问题。"
  utter_capabilities:
    - text: "我是图书馆智能助手（演示）。可协助：图书借阅与归还、借阅指引、研讨间/座位预约、主题推荐阅读、开放数据类咨询（不编造具体数字），以及馆规 FAQ。"
  utter_greet:
    - text: 您好，欢迎使用图书馆智能助手。
  utter_goodbye:
    - text: 再见，欢迎常来图书馆。

  utter_borrow_guide:
    - text: "借书一般流程：① 在目录或检索机查询书目与索书号；② 到对应书库取书；③ 持读者证在借还台办理借阅。演示环境未对接真实 OPAC，具体以馆方系统为准。"

  utter_borrow_query_done_hint:
    - text: "已按书名查过在架情况。若要换书名再查，请再说一次「借书」；也可以说还书、预约、推荐阅读等。"

  utter_return_query_done_hint:
    - text: "已按书名查过待还记录。若要换书名再查，请再说一次「还书」；也可以说借书、预约等。"

  utter_data_inquiry:
    - text: "涉及馆藏统计、借阅趋势等数据，演示助手不返回精确数字；正式环境需对接报表 API 并做权限与审计。您可先说明想了解的指标类型与时间范围。"

  utter_ask_book_title:
    - text: 请问要办理的书名是？
  utter_ask_call_number:
    - text: 请回复上方列表中的索书号（或条码号），也可以直接回复序号（如「1」「第2本」）。

  utter_ask_room_type:
    - text: 请问预约哪种空间？例如自习座位、研讨间、静音阅览区。
  utter_ask_time_slot:
    - text: 请问希望的时间段？例如「本周五下午」或「明天上午」。

  utter_ask_borrow_confirm:
    - text: 确认借阅《{book_title}》（索书号 {call_number}）吗？
  utter_ask_borrow_confirm_then_no:
    - text: 好的，已取消本次确认，请重新说明借阅需求。
  utter_ask_borrow_confirm_then_yes:
    - text: 正在为您提交借阅请求（演示）……
  utter_api_borrow_succeed_true:
    - text: "{last_borrow_detail}"
  utter_api_borrow_succeed_false:
    - text: "{last_borrow_detail}"

  utter_ask_return_confirm:
    - text: 确认归还《{book_title}》（索书号 {call_number}）吗？
  utter_ask_return_confirm_then_no:
    - text: 好的，已取消归还确认。
  utter_ask_return_confirm_then_yes:
    - text: 正在为您办理归还（演示）……
  utter_api_return_succeed_true:
    - text: "{last_return_detail}"
  utter_api_return_succeed_false:
    - text: "{last_return_detail}"

  utter_ask_space_confirm:
    - text: 确认预约「{room_type}」在「{time_slot}」吗？
  utter_ask_space_confirm_then_no:
    - text: 好的，已取消预约确认。
  utter_ask_space_confirm_then_yes:
    - text: 正在提交空间预约（演示）……
  utter_api_space_succeed_true:
    - text: 预约成功（演示）。请按预约时段到场，如需取消请提前在系统或服务台办理。
  utter_api_space_succeed_false:
    - text: 预约未通过（演示），可能为时段冲突或类型不可用，请更换时段或空间类型。

actions:
  - utter_greet
  - utter_goodbye
  - utter_capabilities
  - utter_default
  - utter_borrow_guide
  - utter_borrow_query_done_hint
  - utter_return_query_done_hint
  - utter_data_inquiry
  - utter_ask_book_title
  - utter_ask_call_number
  - utter_ask_room_type
  - utter_ask_time_slot
  - respond_faq

  - validate_borrow_book_form
  - action_ask_borrow_book_form_book_title
  - action_borrow_book_form_submit
  - validate_borrow_call_form
  - action_borrow_call_form_submit
  - action_borrow_book
  - utter_ask_borrow_confirm_then_no
  - utter_ask_borrow_confirm_then_yes
  - utter_api_borrow_succeed_true
  - utter_api_borrow_succeed_false

  - validate_return_book_form
  - action_ask_return_book_form_book_title
  - action_return_book_form_submit
  - validate_return_call_form
  - action_return_call_form_submit
  - action_return_book
  - utter_ask_return_confirm_then_no
  - utter_ask_return_confirm_then_yes
  - utter_api_return_succeed_true
  - utter_api_return_succeed_false

  - validate_space_booking_form
  - action_space_booking_form_submit
  - action_space_booking
  - utter_ask_space_confirm
  - utter_ask_space_confirm_then_no
  - utter_ask_space_confirm_then_yes
  - utter_api_space_succeed_true
  - utter_api_space_succeed_false

  - action_reading_recommend
  - action_book_overview
  - action_borrow_record_query
  - action_data_inquiry
  - action_nlu_fallback_router

session_config:
  # 0 表示会话永不过期，同一 sender 会长期保留 active_loop，表现为「每条回复后都追问预约空间」。
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
